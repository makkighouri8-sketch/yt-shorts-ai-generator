<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Shorts & Viral AI Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="p-4 border-b border-gray-800 flex justify-between items-center max-w-4xl mx-auto w-full">
        <div class="flex items-center space-x-2">
            <span class="text-red-500 text-2xl">▶</span>
            <h1 class="text-xl font-bold tracking-wide">Viral Shorts AI</h1>
        </div>
        
        <!-- Language Selector -->
        <div class="flex items-center space-x-2">
            <span class="text-sm text-gray-400">🌐</span>
            <select id="languageSelect" class="bg-gray-800 text-white text-sm px-3 py-1.5 rounded-lg border border-gray-700 focus:outline-none focus:border-purple-500">
                <option value="English" selected>English</option>
                <option value="Urdu">Urdu (اردو)</option>
            </select>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto px-4 py-8 w-full flex-1">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent mb-2">
                Turn Long Videos into Viral Shorts
            </h2>
            <p class="text-gray-400 text-sm">
                Extract top clips, viral hooks, scripts & captions for YouTube, TikTok & Reels.
            </p>
        </div>

        <!-- Input Form -->
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-xl mb-6">
            <input type="text" id="videoUrl" placeholder="Paste YouTube, TikTok or Instagram URL..." 
                class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 text-white mb-3">
            
            <button onclick="generateClips()" id="genBtn" 
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 font-semibold py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-purple-950">
                ✨ Generate Clips
            </button>
        </div>

        <!-- Error Box -->
        <div id="errorBox" class="hidden bg-red-950/80 border border-red-800 text-red-200 p-4 rounded-xl text-sm mb-6"></div>

        <!-- Result Box -->
        <div id="resultBox" class="hidden bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-purple-400 flex items-center gap-2">🔥 Viral Clip Ideas</h3>
                <button onclick="copyResult()" class="text-xs bg-gray-800 border border-gray-700 hover:bg-gray-700 px-3 py-1.5 rounded-lg">📋 Copy All</button>
            </div>
            <div id="resultContent" class="text-gray-300 text-sm space-y-4 leading-relaxed"></div>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-gray-600 border-t border-gray-900">
        Powered by Flask & Gemini 2.5 Flash • Ready for Micro-SaaS
    </footer>

    <script>
        async function generateClips() {
            const url = document.getElementById("videoUrl").value.trim();
            const language = document.getElementById("languageSelect").value;
            const btn = document.getElementById("genBtn");
            const errorBox = document.getElementById("errorBox");
            const resultBox = document.getElementById("resultBox");
            const resultContent = document.getElementById("resultContent");

            if (!url) {
                errorBox.innerText = "Please enter a valid video URL.";
                errorBox.classList.remove("hidden");
                return;
            }

            errorBox.classList.add("hidden");
            resultBox.classList.add("hidden");
            btn.disabled = true;
            btn.innerText = "⏳ Generating Viral Strategy...";

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: url, language: language })
                });

                const data = await response.json();

                if (response.ok) {
                    resultContent.innerHTML = marked.parse(data.result);
                    resultBox.classList.remove("hidden");
                } else {
                    errorBox.innerText = data.error || "An error occurred.";
                    errorBox.classList.remove("hidden");
                }
            } catch (err) {
                errorBox.innerText = "Network error. Please try again.";
                errorBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerText = "✨ Generate Clips";
            }
        }

        function copyResult() {
            const text = document.getElementById("resultContent").innerText;
            navigator.clipboard.writeText(text);
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
